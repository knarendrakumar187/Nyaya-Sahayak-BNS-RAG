# Render Blueprint — Free FastAPI backend only
# Frontend: deploy separately on Vercel
# https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: nyaya-sahayak-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SERVE_FRONTEND
        value: "false"
      # Allow Vercel UI (and local). Tighten to your exact Vercel URL later if you want.
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_AUTH
        value: "true"
      - key: API_KEY
        sync: false
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp/hf
