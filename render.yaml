# Render Blueprint — Free FastAPI backend only
# Frontend: deploy separately on Vercel (see DEPLOYMENT.md)
# Dashboard: New → Blueprint → connect this repo

services:
  - type: web
    name: nyaya-sahayak-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # REQUIRED — set in Render dashboard (never commit)
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: SERVE_FRONTEND
        value: "false"
      # After Vercel deploy, optionally tighten to: https://your-app.vercel.app
      - key: CORS_ORIGINS
        value: "*"
      # false = uploads work without pasting a key (good for first deploy).
      # Set true + API_KEY later if you want to lock upload/ingest/delete.
      - key: ENABLE_AUTH
        value: "false"
      - key: API_KEY
        sync: false
      - key: RATE_LIMIT
        value: "30/minute"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp/hf
      # Tight caps if someone still tries a live custom-PDF rebuild on Free
      - key: MAX_PDF_PAGES
        value: "8"
      - key: MAX_INDEX_CHUNKS
        value: "48"
      - key: EMBED_BATCH_SIZE
        value: "4"
