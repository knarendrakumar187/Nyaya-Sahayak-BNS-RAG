# Render Blueprint — Free web service (UI + API in one Docker image)
# https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: nyaya-sahayak
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SERVE_FRONTEND
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_AUTH
        value: "true"
      - key: API_KEY
        sync: false
      # Keep memory low on Free (512 MB)
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp/hf
