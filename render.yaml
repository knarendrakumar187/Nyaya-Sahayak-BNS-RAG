services:
  - type: web
    name: nyaya-sahayak
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SERVE_FRONTEND
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_AUTH
        value: "true"
      - key: API_KEY
        sync: false
    disk:
      name: nyaya-data
      mountPath: /app/data
      sizeGB: 2
